name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar o wrapper do Gradle
        uses: gradle/actions/wrapper-validation@v6

      # O build local usa o JBR 25 do Android Studio. O projeto compila para Java 17.
      - name: Instalar o JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar o Gradle com cache
        uses: gradle/actions/setup-gradle@v6

      - name: Testes JVM e APK de debug
        run: ./gradlew test assembleDebug

      - name: Publicar o APK de debug
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
